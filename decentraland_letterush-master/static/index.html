<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LetteRush — Decentraland Web</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(23, 32, 54, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 36px 30px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.desc {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.5;
      margin: 0 0 20px 0;
    }
    .feature-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      color: #cbd5e1;
      font-size: 14px;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(129, 140, 248, 0.25);
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      border-radius: 10px;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px -5px rgba(99, 102, 241, 0.6);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Decentraland Web Client</div>
    <h1>LetteRush</h1>
    <p class="desc">Multiplayer casino floor & word challenge.</p>

    <div class="feature-pill">
      ✓ Runs 100% in Browser (No App Download Needed)
    </div>

    <div class="status">
      <div class="spinner"></div>
      <span>Loading WebAssembly engine...</span>
    </div>
    <a id="playLink" class="btn" href="#">Play In Browser Now</a>
  </div>
  <script>
    const realmUrl = window.location.origin + '/letterush/about';
    // Direct browser WebAssembly/WebGPU client (bypasses the Genesis Plaza download app portal)
    const targetUrl = 'https://decentraland.org/bevy-web/?realm=' + encodeURIComponent(realmUrl) + '&position=0,0';
    document.getElementById('playLink').href = targetUrl;
    setTimeout(() => {
      window.location.href = targetUrl;
    }, 1200);
  </script>
</body>
</html>
